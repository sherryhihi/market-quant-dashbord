name: Auto Update Market Dashboard

on:
  schedule:
    # 台股盤後：台灣時間週一至週五 17:30
    # 對應 UTC 週一至週五 09:30
    - cron: '30 9 * * 1-5'

    # 美股盤後：台灣時間週二至週六 06:30
    # 對應 UTC 週一至週五 22:30
    - cron: '30 22 * * 1-5'

  # 允許手動觸發
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-data:
    name: Fetch market data and update data.json
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TZ: Asia/Taipei
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          # 暫不啟用 pip cache，因此不需要 requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install yfinance pandas requests lxml

      - name: Check Python script exists
        run: |
          if [[ ! -f fetch_market_data.py ]]; then
            echo "::error::找不到根目錄的 fetch_market_data.py，請確認檔名與路徑。"
            echo "目前儲存庫內的檔案："
            git ls-files
            exit 1
          fi

      - name: Run market data script
        run: |
          python fetch_market_data.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data.json")

          if not path.is_file():
              raise SystemExit("找不到 data.json，請確認 Python 腳本輸出位置。")

          if path.stat().st_size == 0:
              raise SystemExit("data.json 是空檔案。")

          def reject_nonstandard_constant(value):
              raise ValueError(f"JSON 包含不合法數值：{value}")

          with path.open(encoding="utf-8") as file:
              data = json.load(
                  file,
                  parse_constant=reject_nonstandard_constant,
              )

          if not isinstance(data, dict):
              raise SystemExit("data.json 的最外層必須是 JSON 物件。")

          required_keys = [
              "last_updated",
              "market_performance",
              "normalized_history",
              "tw_margin",
              "treasury_yields",
          ]

          missing = [key for key in required_keys if key not in data]

          if missing:
              raise SystemExit(f"data.json 缺少必要欄位：{missing}")

          print("data.json 基本格式驗證通過。")
          PY

      - name: Commit and push updated data
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- data.json

          if git diff --cached --quiet -- data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data.json 沒有變更，略過提交。"
            exit 0
          fi

          git commit -m "chore: auto-update market data"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Write success summary
        if: success()
        env:
          DATA_CHANGED: ${{ steps.publish.outputs.changed }}
        run: |
          {
            echo "## 市場資料更新流程完成"
            echo ""

            if [[ "$DATA_CHANGED" == "true" ]]; then
              echo "- data.json 已產生變更，並成功提交與推送。"
            else
              echo "- 腳本執行與 JSON 基本驗證完成。"
              echo "- data.json 無變更，因此未建立新提交。"
            fi

            echo ""
            echo "- 完成時間：$(date '+%Y-%m-%d %H:%M:%S %Z')"
            echo "- 注意：格式驗證不代表每個外部資料來源都成功或資料為最新。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Write failure summary
        if: failure()
        run: |
          {
            echo "## 市場資料更新失敗"
            echo ""
            echo "- 請開啟本次工作，查看第一個紅色失敗步驟的完整日誌。"
            echo "- 若尚未完成推送，儲存庫中的 data.json 不會由本次流程更新。"
            echo "- 常見原因：腳本不存在、套件安裝失敗、資料格式錯誤或推送權限不足。"
          } >> "$GITHUB_STEP_SUMMARY"
